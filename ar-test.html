<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Baseball Legends Museum - AR Test</title>


    <!-- MindAR -->
    <script
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js">
    </script>

    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.2.0/aframe.min.js">
    </script>

    <!-- Integración MindAR + A-Frame -->
    <script
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js">
    </script>


    <style>

        body {
            margin: 0;
        }


        #status {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 99999;

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            border-radius: 18px;

            font-family: Arial, sans-serif;
            font-weight: bold;

            text-align: center;

            pointer-events: none;
        }


        #back-button {
            position: fixed;

            top: 20px;
            left: 15px;

            z-index: 100000;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            text-decoration: none;
        }

    </style>

</head>


<body>


    <a
        id="back-button"
        href="index.html"
    >
        ← Volver
    </a>


    <div id="status">
        Iniciando AR...
    </div>



    <!-- =====================================================
         ESCENA AR
         ===================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: assets/ar/targets/arizona-target.mind;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true,
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- =================================================
             ASSETS
             ================================================= -->

        <a-assets>

            <a-asset-item
                id="twinsModel"
                src="assets/models/EnOrigen2.glb?v=2">
            </a-asset-item>

        </a-assets>



        <!-- =================================================
             CÁMARA
             ================================================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>



        <!-- =================================================
             MARCADOR
             ================================================= -->

        <a-entity

            id="ar-target"

            mindar-image-target="targetIndex: 0"

        >


            <!-- Cubo de diagnóstico -->

            <a-box

                position="0 0 0.1"

                scale="0.15 0.15 0.15"

                color="red">

            </a-box>



            <!-- Modelo Minnesota -->

            <a-gltf-model

                id="twins-model"

                src="#twinsModel"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.12 0.12 0.12">

            </a-gltf-model>


        </a-entity>


    </a-scene>



    <!-- =====================================================
         EVENTOS
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const scene =
                    document.getElementById("ar-scene");


                const target =
                    document.getElementById("ar-target");


                const model =
                    document.getElementById("twins-model");


                const status =
                    document.getElementById("status");



                // =============================================
                // MINDAR LISTO
                // =============================================

                scene.addEventListener(
                    "arReady",
                    () => {

                        status.textContent =
                            "✅ Cámara lista — buscando marcador";

                        console.log(
                            "✅ MindAR iniciado"
                        );

                    }
                );



                // =============================================
                // ERROR AR
                // =============================================

                scene.addEventListener(
                    "arError",
                    (event) => {

                        status.textContent =
                            "❌ Error iniciando AR";

                        console.error(
                            "MindAR error:",
                            event
                        );

                    }
                );



                // =============================================
                // MARCADOR ENCONTRADO
                // =============================================

                target.addEventListener(
                    "targetFound",
                    () => {

                        status.textContent =
                            "🎯 MARCADOR DETECTADO";

                        console.log(
                            "✅ Arizona detectado"
                        );

                    }
                );



                // =============================================
                // MARCADOR PERDIDO
                // =============================================

                target.addEventListener(
                    "targetLost",
                    () => {

                        status.textContent =
                            "🔎 Buscando marcador...";

                    }
                );



                // =============================================
                // MODELO CARGADO
                // =============================================

                model.addEventListener(
                    "model-loaded",
                    () => {

                        console.log(
                            "✅ EnOrigen2.glb cargado"
                        );

                    }
                );



                // =============================================
                // ERROR DEL MODELO
                // =============================================

                model.addEventListener(
                    "model-error",
                    (event) => {

                        status.textContent =
                            "⚠️ Error cargando modelo";

                        console.error(
                            "GLB error:",
                            event
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
