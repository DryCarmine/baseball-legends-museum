<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Baseball Legends Museum - AR</title>


    <!-- MindAR -->
    <script
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js">
    </script>

    <!-- A-Frame -->
    <script
        src="https://aframe.io/releases/1.2.0/aframe.min.js">
    </script>

    <!-- Integración MindAR + A-Frame -->
    <script
        src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js">
    </script>


    <style>

        body {
            margin: 0;
        }


        #status {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 99999;

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            border-radius: 18px;

            font-family: Arial, sans-serif;
            font-weight: bold;

            text-align: center;

            pointer-events: none;
        }


        #back-button {
            position: fixed;

            top: 20px;
            left: 15px;

            z-index: 100000;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            text-decoration: none;
        }


        #instructions {
            position: fixed;

            left: 50%;
            bottom: 132px;

            transform: translateX(-50%);

            z-index: 99999;

            width: calc(100% - 40px);
            max-width: 440px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.72);
            color: white;

            border-radius: 12px;

            font-family: Arial, sans-serif;
            font-size: 13px;

            text-align: center;

            pointer-events: none;
        }


        #ar-controls {
            position: fixed;

            left: 50%;
            bottom: 20px;

            transform: translateX(-50%);

            z-index: 100000;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;

            width: calc(100% - 30px);
            max-width: 460px;

            pointer-events: none;
        }


        .ar-control-button {
            min-height: 48px;

            padding: 9px 8px;

            border: 1px solid #d4af37;
            border-radius: 12px;

            background: rgba(10, 17, 40, 0.92);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;
        }


        .ar-control-button:active:not(:disabled) {
            transform: scale(0.96);
        }


        .ar-control-button:disabled {
            opacity: 0.42;
            cursor: default;
        }


        .ar-control-button.active {
            color: #d4af37;
        }


        #toggle-motion {
            grid-column: 1 / span 2;
        }


        #toggle-particles {
            grid-column: 3;
        }


        @media (max-width: 380px) {

            #ar-controls {
                gap: 6px;
            }


            .ar-control-button {
                min-height: 46px;

                padding: 8px 5px;

                font-size: 12px;
            }


            #instructions {
                bottom: 126px;
            }

        }

    </style>

</head>


<body>


    <a
        id="back-button"
        href="index.html"
    >
        ← Volver
    </a>


    <div id="status">
        Iniciando AR...
    </div>


    <div id="instructions">
        Apunta la cámara al marcador de prueba.
    </div>


    <!-- =====================================================
         CONTROLES AR
         ===================================================== -->

    <div id="ar-controls">

        <button
            id="rotate-left"
            class="ar-control-button"
            type="button"
            disabled
        >
            ↶ Izquierda
        </button>


        <button
            id="rotate-right"
            class="ar-control-button"
            type="button"
            disabled
        >
            Derecha ↷
        </button>


        <button
            id="toggle-particles"
            class="ar-control-button active"
            type="button"
            disabled
        >
            ✨ Partículas
        </button>


        <button
            id="toggle-motion"
            class="ar-control-button"
            type="button"
            disabled
        >
            ⏸ Pausar movimiento
        </button>

    </div>



    <!-- =====================================================
         ESCENA AR
         ===================================================== -->

    <a-scene

        id="ar-scene"

        mindar-image="
            imageTargetSrc: assets/ar/targets/arizona-target.mind?v=6;
        "

        color-space="sRGB"

        renderer="
            colorManagement: true,
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- =================================================
             ASSETS
             ================================================= -->

        <a-assets>

            <a-asset-item
                id="twinsModel"
                src="assets/models/EnOrigen2.glb?v=6">
            </a-asset-item>

        </a-assets>



        <!-- =================================================
             CÁMARA
             ================================================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false">

        </a-camera>



        <!-- =================================================
             MARCADOR

             TEMPORAL:
             Usamos Arizona porque su target ya es estable.
             ================================================= -->

        <a-entity

            id="ar-target"

            mindar-image-target="targetIndex: 0"

        >


            <!-- =============================================
                 PARTÍCULAS
                 ============================================= -->

            <a-entity
                id="particle-group"
                position="0 0 0">
            </a-entity>



            <!-- =============================================
                 MODELO
                 ============================================= -->

            <a-gltf-model

                id="player-model"

                src="#twinsModel"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.12 0.12 0.12">

            </a-gltf-model>


        </a-entity>


    </a-scene>



    <!-- =====================================================
         LÓGICA AR
         ===================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const scene =
                    document.getElementById("ar-scene");


                const target =
                    document.getElementById("ar-target");


                const model =
                    document.getElementById("player-model");


                const particleGroup =
                    document.getElementById("particle-group");


                const status =
                    document.getElementById("status");


                const instructions =
                    document.getElementById("instructions");


                const rotateLeft =
                    document.getElementById("rotate-left");


                const rotateRight =
                    document.getElementById("rotate-right");


                const toggleMotion =
                    document.getElementById("toggle-motion");


                const toggleParticles =
                    document.getElementById("toggle-particles");



                // =============================================
                // ESTADO
                // =============================================

                let targetVisible = false;

                let modelLoaded = false;

                let movementPaused = false;

                let particlesEnabled = true;

                let previousTime = performance.now();


                const baseModelPosition = {
                    x: 0,
                    y: 0,
                    z: 0.1
                };


                // Movimiento flotante
                const FLOAT_HEIGHT = 0.045;

                const FLOAT_SPEED = 0.0024;


                // 15 grados por pulsación
                const ROTATION_STEP =
                    Math.PI / 12;



                // =============================================
                // PARTÍCULAS
                // =============================================

                const particles = [];

                const PARTICLE_COUNT = 20;


                function randomBetween(min, max) {

                    return Math.random() * (max - min) + min;

                }


                function createParticles() {

                    for (
                        let i = 0;
                        i < PARTICLE_COUNT;
                        i++
                    ) {

                        const particle =
                            document.createElement("a-sphere");


                        const radius =
                            randomBetween(0.008, 0.018);


                        const particleData = {

                            x: randomBetween(-0.42, 0.42),

                            y: randomBetween(0.02, 0.82),

                            z: randomBetween(-0.15, 0.18),

                            speed: randomBetween(
                                0.00006,
                                0.00014
                            ),

                            drift: randomBetween(
                                0.6,
                                1.6
                            ),

                            phase: randomBetween(
                                0,
                                Math.PI * 2
                            )

                        };


                        particle.setAttribute(
                            "radius",
                            radius
                        );


                        particle.setAttribute(
                            "segments-height",
                            8
                        );


                        particle.setAttribute(
                            "segments-width",
                            8
                        );


                        const color =
                            i % 3 === 0
                                ? "#fff4c2"
                                : "#d4af37";


                        particle.setAttribute(
                            "material",
                            `
                                color: ${color};
                                opacity: 0.82;
                                transparent: true;
                                shader: flat;
                            `
                        );


                        particle.object3D.position.set(
                            particleData.x,
                            particleData.y,
                            particleData.z
                        );


                        particleGroup.appendChild(
                            particle
                        );


                        particles.push({
                            element: particle,
                            ...particleData
                        });

                    }

                }



                // =============================================
                // HABILITAR / DESHABILITAR CONTROLES
                // =============================================

                function updateControls() {

                    const enabled =
                        targetVisible &&
                        modelLoaded;


                    rotateLeft.disabled =
                        !enabled;


                    rotateRight.disabled =
                        !enabled;


                    toggleMotion.disabled =
                        !enabled;


                    toggleParticles.disabled =
                        !enabled;

                }



                // =============================================
                // ROTACIÓN MANUAL
                // =============================================

                function rotateModel(direction) {

                    if (
                        !targetVisible ||
                        !modelLoaded
                    ) {
                        return;
                    }


                    model.object3D.rotation.y +=
                        ROTATION_STEP *
                        direction;

                }


                rotateLeft.addEventListener(
                    "click",
                    () => {

                        rotateModel(1);

                    }
                );


                rotateRight.addEventListener(
                    "click",
                    () => {

                        rotateModel(-1);

                    }
                );



                // =============================================
                // PAUSAR MOVIMIENTO FLOTANTE
                // =============================================

                function updateMovementButton() {

                    if (movementPaused) {

                        toggleMotion.textContent =
                            "▶ Reanudar movimiento";

                        toggleMotion.classList.add(
                            "active"
                        );

                    } else {

                        toggleMotion.textContent =
                            "⏸ Pausar movimiento";

                        toggleMotion.classList.remove(
                            "active"
                        );

                    }

                }


                toggleMotion.addEventListener(
                    "click",
                    () => {

                        if (
                            !targetVisible ||
                            !modelLoaded
                        ) {
                            return;
                        }


                        movementPaused =
                            !movementPaused;


                        /*
                         * Al pausar, regresamos lentamente la
                         * posición al centro para evitar que
                         * quede congelado arriba o abajo.
                         */

                        if (movementPaused) {

                            model.object3D.position.y =
                                baseModelPosition.y;

                        }


                        updateMovementButton();

                    }
                );



                // =============================================
                // ACTIVAR / QUITAR PARTÍCULAS
                // =============================================

                function updateParticlesButton() {

                    particleGroup.object3D.visible =
                        particlesEnabled;


                    if (particlesEnabled) {

                        toggleParticles.textContent =
                            "✨ Partículas";

                        toggleParticles.classList.add(
                            "active"
                        );

                    } else {

                        toggleParticles.textContent =
                            "○ Sin partículas";

                        toggleParticles.classList.remove(
                            "active"
                        );

                    }

                }


                toggleParticles.addEventListener(
                    "click",
                    () => {

                        if (
                            !targetVisible ||
                            !modelLoaded
                        ) {
                            return;
                        }


                        particlesEnabled =
                            !particlesEnabled;


                        updateParticlesButton();

                    }
                );



                // =============================================
                // LOOP DE ANIMACIÓN
                // =============================================

                function animate(currentTime) {

                    const delta =
                        Math.min(
                            currentTime - previousTime,
                            50
                        );


                    previousTime =
                        currentTime;


                    if (
                        targetVisible &&
                        modelLoaded
                    ) {

                        // -------------------------------------
                        // MOVIMIENTO FLOTANTE
                        // -------------------------------------

                        if (!movementPaused) {

                            model.object3D.position.y =
                                baseModelPosition.y +
                                Math.sin(
                                    currentTime *
                                    FLOAT_SPEED
                                ) *
                                FLOAT_HEIGHT;

                        }


                        // -------------------------------------
                        // PARTÍCULAS
                        // -------------------------------------

                        if (particlesEnabled) {

                            particles.forEach(
                                particle => {

                                    particle.y +=
                                        delta *
                                        particle.speed;


                                    const offsetX =
                                        Math.sin(
                                            currentTime *
                                            0.001 *
                                            particle.drift +
                                            particle.phase
                                        ) *
                                        0.025;


                                    particle.element
                                        .object3D
                                        .position
                                        .set(
                                            particle.x +
                                            offsetX,

                                            particle.y,

                                            particle.z
                                        );


                                    if (
                                        particle.y > 0.9
                                    ) {

                                        particle.y =
                                            randomBetween(
                                                0.01,
                                                0.12
                                            );


                                        particle.x =
                                            randomBetween(
                                                -0.42,
                                                0.42
                                            );


                                        particle.z =
                                            randomBetween(
                                                -0.15,
                                                0.18
                                            );

                                    }

                                }
                            );

                        }

                    }


                    requestAnimationFrame(
                        animate
                    );

                }



                // =============================================
                // MINDAR LISTO
                // =============================================

                scene.addEventListener(
                    "arReady",
                    () => {

                        status.textContent =
                            "✅ Cámara lista — buscando marcador";

                        instructions.textContent =
                            "Apunta la cámara al marcador de prueba.";

                        console.log(
                            "✅ MindAR iniciado"
                        );

                    }
                );



                // =============================================
                // ERROR AR
                // =============================================

                scene.addEventListener(
                    "arError",
                    (event) => {

                        status.textContent =
                            "❌ Error iniciando AR";

                        console.error(
                            "MindAR error:",
                            event
                        );

                    }
                );



                // =============================================
                // MARCADOR ENCONTRADO
                // =============================================

                target.addEventListener(
                    "targetFound",
                    () => {

                        targetVisible = true;


                        status.textContent =
                            "🎯 MARCADOR DETECTADO";


                        instructions.textContent =
                            "Usa los controles para mover el modelo y personalizar el efecto.";


                        updateControls();


                        console.log(
                            "✅ Marcador detectado"
                        );

                    }
                );



                // =============================================
                // MARCADOR PERDIDO
                // =============================================

                target.addEventListener(
                    "targetLost",
                    () => {

                        targetVisible = false;


                        status.textContent =
                            "🔎 Buscando marcador...";


                        instructions.textContent =
                            "Vuelve a enfocar el marcador.";


                        updateControls();

                    }
                );



                // =============================================
                // MODELO CARGADO
                // =============================================

                model.addEventListener(
                    "model-loaded",
                    () => {

                        modelLoaded = true;


                        model.object3D.position.set(
                            baseModelPosition.x,
                            baseModelPosition.y,
                            baseModelPosition.z
                        );


                        updateControls();


                        console.log(
                            "✅ EnOrigen2.glb cargado"
                        );

                    }
                );



                // =============================================
                // ERROR DEL MODELO
                // =============================================

                model.addEventListener(
                    "model-error",
                    (event) => {

                        status.textContent =
                            "⚠️ Error cargando modelo";


                        modelLoaded = false;


                        updateControls();


                        console.error(
                            "GLB error:",
                            event
                        );

                    }
                );



                // =============================================
                // INICIALIZACIÓN
                // =============================================

                createParticles();

                updateMovementButton();

                updateParticlesButton();

                updateControls();


                requestAnimationFrame(
                    animate
                );

            }
        );

    </script>


</body>

</html>
