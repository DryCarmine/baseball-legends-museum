<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baseball Legends Museum</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <!-- Barra Superior -->
        <header class="top-status-bar">
            <button id="btn-back" class="hidden">◀ Volver</button>

            <div id="user-info" class="user-level">
                <span class="level-badge">1</span>
                <span class="username">Novato</span>
            </div>

            <div class="stats">
                <div class="stat-box">⚾ <span id="puntos-trivia">0</span></div>
                <div class="stat-box">🏆 <span id="trofeos-ar">0/10</span></div>

                <!-- Configuración -->
                <button
                    id="btn-config"
                    class="config-button"
                    aria-label="Configuración"
                    title="Configuración">
                    ⚙️
                </button>
            </div>
        </header>
<a
    href="ar-test.html"
    class="ar-test-button"
    title="Prueba independiente de AR"
>
    🧪 AR Test
</a>
<a
    href="index.html"
    style="
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 999999;
        background: rgba(0,0,0,0.75);
        color: white;
        padding: 10px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-family: Arial, sans-serif;
    "
>
    ← Volver
</a>
        <!-- CONTENEDOR DINÁMICO -->
        <main id="app-content" class="main-stage">
            <!-- JavaScript inyectará las vistas aquí -->
        </main>

        <!-- Navegación Inferior -->
<nav class="bottom-nav">
    <button class="nav-item" data-vista="historia">
        📜<br>Historia
    </button>

    <button class="nav-item" data-vista="estadisticas">
        📊<br>Stats
    </button>

    <button class="nav-item active" data-vista="menu">
        ⚾<br>Inicio
    </button>

    <button class="nav-item" data-vista="partidos">
        📅<br>Partidos
    </button>

    <button class="nav-item" data-vista="filtros" id="btn-filtros">
        🎬<br>Filtros
    </button>

    <button class="nav-item" data-vista="ar" id="btn-ar">
        📷<br>AR
    </button>
</nav>

    </div>

    <!-- Scripts de la aplicación -->
    <!-- teams.js debe cargarse antes de app.js porque app.js utilizará MLB_TEAMS -->
<script src="js/teams.js"></script>
<script src="js/trivia.js"></script>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="js/partidos.js"></script>
<script src="js/app.js"></script>
<script src="js/ar.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
