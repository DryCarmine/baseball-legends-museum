<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baseball Legends Museum</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <!-- Barra Superior -->
        <header class="top-status-bar">
            <button id="btn-back" class="hidden">◀ Volver</button>

            <div id="user-info" class="user-level">
                <span class="level-badge">1</span>
                <span class="username">Novato</span>
            </div>

            <div class="stats">
                <div class="stat-box">⚾ <span id="puntos-trivia">0</span></div>
                <div class="stat-box">🏆 <span id="trofeos-ar">0/10</span></div>

                <!-- Configuración -->
                <button
                    id="btn-config"
                    class="config-button"
                    aria-label="Configuración"
                    title="Configuración">
                    ⚙️
                </button>
            </div>
        </header>

        <!-- CONTENEDOR DINÁMICO -->
        <main id="app-content" class="main-stage">
            <!-- JavaScript inyectará las vistas aquí -->
        </main>

        <!-- Navegación Inferior -->
<nav class="bottom-nav">
    <button class="nav-item" data-vista="historia">📜<br>Historia</button>
    <button class="nav-item" data-vista="estadisticas">📊<br>Stats</button>
    <button class="nav-item active" data-vista="menu">⚾<br>Inicio</button>
    <button class="nav-item" data-vista="partidos">📅<br>Partidos</button>
    <button class="nav-item" id="btn-ar">📹<br>AR</button>
</nav>

    </div>

    <!-- Scripts de la aplicación -->
    <!-- teams.js debe cargarse antes de app.js porque app.js utilizará MLB_TEAMS -->
    <script src="js/teams.js"></script>
<script src="js/trivia.js"></script>
<script src="js/partidos.js"></script>
<script src="js/app.js"></script>
</html>
