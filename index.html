<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baseball Legends Museum</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">

        <!-- Encabezado de progreso del museo -->
        <header class="museum-header">

            <section
                id="museum-rank-card"
                class="museum-rank-card"
                aria-label="Rango del museo">

                <div
                    id="museum-rank-icon"
                    class="museum-rank-icon"
                    aria-hidden="true">
                    ⚾
                </div>

                <div class="museum-rank-info">

                    <span class="museum-rank-kicker">
                        RANGO DEL MUSEO
                    </span>

                    <div class="museum-rank-main">
                        <strong id="museum-rank-name">
                            Novato
                        </strong>

                        <span id="museum-rank-progress-label">
                            3 piezas para Aficionado
                        </span>
                    </div>

                    <div
                        class="museum-rank-progress"
                        aria-hidden="true">

                        <div
                            id="museum-rank-progress-fill"
                            class="museum-rank-progress-fill">
                        </div>

                    </div>

                </div>

            </section>


            <div class="museum-header-actions">

                <div
                    class="museum-collection-chip"
                    title="Piezas desbloqueadas">

                    <span>COLECCIÓN</span>

                    <strong id="museum-collection-count">
                        0 / 36
                    </strong>

                </div>


                <button
                    id="btn-config"
                    class="config-button"
                    type="button"
                    aria-label="Configuración"
                    title="Configuración">
                    ⚙️
                </button>

            </div>

        </header>


        <!-- CONTENEDOR DINÁMICO -->
        <main id="app-content" class="main-stage">
            <!-- JavaScript inyectará las vistas aquí -->
        </main>

        <!-- Navegación Inferior -->
<nav class="bottom-nav">
    <button class="nav-item" data-vista="historia">
        📜<br>Historia
    </button>

    <button class="nav-item" data-vista="estadisticas">
        📊<br>Stats
    </button>

    <button class="nav-item active" data-vista="menu">
        ⚾<br>Inicio
    </button>

    <button class="nav-item" data-vista="partidos">
        📅<br>Partidos
    </button>

    <button class="nav-item" data-vista="filtros" id="btn-filtros">
        🎬<br>Filtros
    </button>

    <button
    class="nav-item"
    id="btn-ar"
    type="button"
    onclick="window.location.href='ar-final.html'"
>
    📷<br>AR
</button>
</nav>

    </div>

    <!-- Scripts de la aplicación -->
    <!-- teams.js debe cargarse antes de app.js porque app.js utilizará MLB_TEAMS -->
<script src="js/teams.js"></script>
<script src="js/trivia.js"></script>
<script src="js/partidos.js"></script>
<script src="js/ranks.js?v=1"></script>
<script src="js/app.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
