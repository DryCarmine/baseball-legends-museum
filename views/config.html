<div class="config-screen">

    <div class="config-header">
        <div>
            <span class="config-kicker">MUSEUM SETTINGS</span>
            <h1>Configuración</h1>
        </div>

        <span class="config-icon">⚙️</span>
    </div>

    <section class="config-card">

        <div class="config-section-title">
            <span class="section-icon">🎨</span>

            <div>
                <h2>Personalización</h2>
                <p>Haz que el museo se sienta como tuyo.</p>
            </div>
        </div>

        <div class="favorite-team-preview">

            <div class="preview-logo-container">
                <img
                    id="selected-team-preview"
                    src=""
                    alt="Equipo favorito">
            </div>

            <div class="preview-info">
                <span>MI EQUIPO FAVORITO</span>
                <strong id="selected-team-name">
                    Selecciona un equipo
                </strong>
            </div>

        </div>

        <div class="team-selector">

            <h3>Selecciona tu equipo</h3>

            <p class="selector-description">
                El logo seleccionado aparecerá en el menú principal.
            </p>

            <div class="league-label">
                ⚾ EQUIPOS MLB
            </div>

            <div id="team-logo-grid" class="team-logo-grid">
                <!-- JavaScript genera los logos -->
            </div>

        </div>

    </section>

</div>
