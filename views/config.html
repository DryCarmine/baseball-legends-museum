<section class="config-page">

    <!-- Encabezado -->
    <div class="config-header">

        <div>
            <span class="config-eyebrow">
                MUSEUM SETTINGS
            </span>

            <h1>
                Configuración
            </h1>
        </div>

        <div class="config-header-icon">
            ⚙️
        </div>

    </div>


    <!-- =====================================================
         PERSONALIZACIÓN
         ===================================================== -->

    <section class="settings-card">

        <div class="settings-card-header">

            <div class="settings-icon">
                🎨
            </div>

            <div>
                <h2>
                    Personalización
                </h2>

                <p>
                    Haz que el museo se sienta como tuyo.
                </p>
            </div>

        </div>


        <div class="settings-divider"></div>


        <!-- =================================================
             EQUIPO FAVORITO
             ================================================= -->

        <div class="favorite-team-card">

            <div class="favorite-team-logo-container">

                <img
                    id="selected-team-logo"
                    src=""
                    alt="Equipo favorito"
                    class="favorite-team-logo"
                >

            </div>


            <div class="favorite-team-info">

                <span class="favorite-team-label">
                    MI EQUIPO FAVORITO
                </span>

                <h3 id="selected-team-name">
                    Selecciona un equipo
                </h3>

            </div>

        </div>


        <!-- =================================================
             SELECTOR DE EQUIPO
             ================================================= -->

        <div class="team-selector-header">

            <h2>
                Selecciona tu equipo
            </h2>

            <p>
                El logo seleccionado aparecerá en el menú principal.
            </p>

        </div>


        <!-- Aquí app.js generará los 30 equipos -->
        <div id="team-logo-grid">

            <!--
                Los equipos se generan automáticamente
                desde js/teams.js mediante app.js.
            -->

        </div>

    </section>

</section>
