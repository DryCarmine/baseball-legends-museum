<style>
  .filtros-wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--color-bg-dark, #0a0a1a);
    color: var(--color-text, #fff);
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }

  /* ── NAVEGACIÓN DE VIDEOS ── */
  .video-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.7);
    border-bottom: 2px solid var(--color-primary, #d4af37);
    gap: 10px;
  }
  .nav-title {
    flex: 1;
    text-align: center;
    min-width: 0;
  }
  .nav-title h2 {
    font-size: clamp(0.85rem, 3vw, 1.05rem);
    color: var(--color-primary, #d4af37);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 2px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-title span {
    display: block;
    font-size: 0.7rem;
    color: #aaa;
  }
  .nav-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--color-primary, #d4af37) 60%, transparent);
    background: color-mix(in srgb, var(--color-primary, #d4af37) 10%, transparent);
    color: var(--color-primary, #d4af37);
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled {
    opacity: 0.35;
    pointer-events: none;
  }

  /* ── ÁREA DE VIDEO / CANVAS ── */
  .video-stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    min-height: 0;
    width: 100%;
  }

  #vid-source {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  #vid-canvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }

  .filter-label-overlay {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    color: var(--color-primary, #d4af37);
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 3px 12px;
    border-radius: 20px;
    pointer-events: none;
    text-transform: uppercase;
  }

  /* ── CONTROLES DE FILTRO ── */
  .filter-controls {
    flex-shrink: 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.6);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .filter-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }

  .filter-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #ccc;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-btn .icon { font-size: 20px; }
  .filter-btn.active {
    border-color: var(--color-primary, #d4af37);
    background: color-mix(in srgb, var(--color-primary, #d4af37) 15%, transparent);
    color: var(--color-primary, #d4af37);
  }
  .filter-btn:active { transform: scale(0.95); }

  /* ── SLIDER DE INTENSIDAD ── */
  .intensity-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .intensity-row label {
    font-size: 11px;
    color: #aaa;
    white-space: nowrap;
  }
  .intensity-row input[type=range] {
    flex: 1;
    accent-color: var(--color-primary, #d4af37);
    height: 4px;
  }
  .intensity-row span {
    font-size: 11px;
    color: var(--color-primary, #d4af37);
    min-width: 30px;
    text-align: right;
  }

  /* ── BOTÓN SIN FILTRO ── */
  .btn-original {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #aaa;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-original.active {
    border-color: var(--color-primary, #d4af37);
    color: var(--color-primary, #d4af37);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 360px) {
    .video-nav { padding: 8px; gap: 6px; }
    .nav-btn { width: 36px; height: 36px; font-size: 0.95rem; }
    .nav-title h2 { font-size: 0.78rem; }
    .nav-title span { font-size: 0.62rem; }
    .filter-btn { font-size: 9px; padding: 6px 2px; }
    .filter-btn .icon { font-size: 16px; }
    .intensity-row label { font-size: 10px; }
    .filter-label-overlay { font-size: 9px; padding: 2px 8px; }
  }
  @media (min-width: 600px) {
    .filtros-wrap {
      max-width: 600px;
      margin: 0 auto;
      border-left: 1px solid rgba(255,255,255,0.08);
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .video-nav { padding: 14px 20px; }
    .nav-title h2 { font-size: 1.05rem; }
    .filter-btn { font-size: 11px; padding: 10px 6px; }
  }
</style>

<div class="filtros-wrap">

  <!-- Header / Navegación de videos -->
  <div class="video-nav" id="video-nav">
    <button class="nav-btn prev" id="btn-prev" onclick="FV.prevVideo()" aria-label="Video anterior">
      ◀
    </button>
    <div class="nav-title">
      <h2 id="video-title">🎬 Videos MLB</h2>
      <span id="video-counter">0 / 0</span>
    </div>
    <button class="nav-btn next" id="btn-next" onclick="FV.nextVideo()" aria-label="Video siguiente">
      ▶
    </button>
  </div>

  <!-- Área de reproducción -->
  <div class="video-stage">
    <video id="vid-source" playsinline loop muted autoplay></video>
    <canvas id="vid-canvas"></canvas>
    <div class="filter-label-overlay" id="filter-label">SIN FILTRO</div>
  </div>

  <!-- Controles -->
  <div class="filter-controls">
    <div class="filter-row">
      <button class="filter-btn" data-filter="blur" onclick="FV.setFilter('blur')">
        <span class="icon">🌫️</span>Desenfoque
      </button>
      <button class="filter-btn" data-filter="pixel" onclick="FV.setFilter('pixel')">
        <span class="icon">🟦</span>Pixelado
      </button>
      <button class="filter-btn" data-filter="thermal" onclick="FV.setFilter('thermal')">
        <span class="icon">🌡️</span>Térmico
      </button>
      <button class="filter-btn" data-filter="saturate" onclick="FV.setFilter('saturate')">
        <span class="icon">🎨</span>Saturado
      </button>
    </div>

    <div class="intensity-row">
      <label>Intensidad</label>
      <input type="range" id="intensity-slider" min="1" max="100" value="50"
             oninput="FV.setIntensity(this.value)">
      <span id="intensity-val">50%</span>
    </div>

    <button class="btn-original active" id="btn-original" onclick="FV.setFilter('none')">
      ▶ SIN FILTRO (ORIGINAL)
    </button>
  </div>

</div>

<script>
(function() {

  const VIDEOS_FOLDER = 'assets/videos/';
  const VIDEO_EXTS = ['.mp4', '.webm', '.mov', '.ogg'];

  /*
   * Si la vista se vuelve a abrir dentro de la SPA,
   * detenemos el loop anterior antes de crear uno nuevo.
   */
  if (
    window.FV &&
    typeof window.FV.destroy === 'function'
  ) {
    window.FV.destroy();
  }

  const FV = window.FV = {

    currentFilter: 'none',
    intensity: 50,

    animFrame: null,
    lastRenderTime: 0,
    targetFrameInterval: 1000 / 30,

    video: null,
    canvas: null,
    ctx: null,

    pixelCanvas: null,
    pixelCtx: null,

    videos: [],
    currentIndex: 0,

    destroyed: false,


    async init() {

      this.destroyed = false;

      this.video =
        document.getElementById('vid-source');

      this.canvas =
        document.getElementById('vid-canvas');

      if (!this.video || !this.canvas) {
        console.error(
          '[filtros] No se encontró video o canvas.'
        );
        return;
      }

      this.ctx =
        this.canvas.getContext(
          '2d',
          { willReadFrequently: true }
        );

      this.pixelCanvas =
        document.createElement('canvas');

      this.pixelCtx =
        this.pixelCanvas.getContext('2d');

      this.applyStoredTeamTheme();

      this.bindVideoEvents();

      this.videos =
        await this.scanVideosFolder(
          VIDEOS_FOLDER
        );

      if (
        this.destroyed ||
        !document.body.contains(this.canvas)
      ) {
        return;
      }

      if (!this.videos.length) {

        this.showEmptyState();

        return;
      }

      this.loadVideoByIndex(0);

      this.loop();
    },


    destroy() {

      this.destroyed = true;

      if (this.animFrame) {

        cancelAnimationFrame(
          this.animFrame
        );

        this.animFrame = null;
      }

      if (this.video) {

        try {
          this.video.pause();
        } catch (_) {}

        this.video.removeAttribute('src');

        try {
          this.video.load();
        } catch (_) {}
      }
    },


    bindVideoEvents() {

      this.video.addEventListener(
        'error',
        () => {

          const label =
            document.getElementById(
              'filter-label'
            );

          if (label) {
            label.textContent =
              'ERROR DE VIDEO';
          }

          console.error(
            '[filtros] Error cargando:',
            this.video.currentSrc ||
            this.video.src
          );
        }
      );


      this.video.addEventListener(
        'loadedmetadata',
        () => {

          this.resizeCanvas(true);

        }
      );
    },


    applyStoredTeamTheme() {

      try {

        if (
          typeof aplicarTemaEquipo === 'function' &&
          typeof MLB_TEAMS !== 'undefined'
        ) {

          const teamId =
            localStorage.getItem(
              'favoriteTeam'
            );

          const team =
            MLB_TEAMS.find(
              t => t.id === teamId
            );

          if (team) {
            aplicarTemaEquipo(team);
          }
        }

      } catch (error) {

        console.warn(
          '[filtros] No se pudo aplicar tema del equipo:',
          error
        );
      }
    },


    async scanVideosFolder(folder) {

      const found =
        new Set();


      /*
       * Ruta principal:
       * el manifiesto data/videos.json.
       */
      try {

        const response =
          await fetch(
            'data/videos.json',
            { cache: 'no-store' }
          );

        if (response.ok) {

          const list =
            await response.json();

          if (Array.isArray(list)) {

            list.forEach(name => {

              if (
                typeof name === 'string' &&
                VIDEO_EXTS.some(
                  ext =>
                    name
                      .toLowerCase()
                      .endsWith(ext)
                )
              ) {

                found.add(name);
              }
            });
          }

        } else {

          console.warn(
            '[filtros] data/videos.json respondió',
            response.status
          );
        }

      } catch (error) {

        console.warn(
          '[filtros] No se pudo leer data/videos.json:',
          error
        );
      }


      /*
       * Respaldo:
       * intenta leer un listado de directorio
       * si el servidor lo permite.
       */
      if (!found.size) {

        try {

          const response =
            await fetch(
              folder,
              { cache: 'no-store' }
            );

          if (response.ok) {

            const html =
              await response.text();

            const doc =
              new DOMParser()
                .parseFromString(
                  html,
                  'text/html'
                );

            Array
              .from(
                doc.querySelectorAll('a')
              )
              .forEach(link => {

                const href =
                  link.getAttribute('href') ||
                  '';

                const clean =
                  href.split('?')[0];

                if (
                  VIDEO_EXTS.some(
                    ext =>
                      clean
                        .toLowerCase()
                        .endsWith(ext)
                  )
                ) {

                  found.add(
                    decodeURIComponent(
                      clean.replace(
                        /^\.?\//,
                        ''
                      )
                    )
                  );
                }
              });
          }

        } catch (error) {

          console.warn(
            '[filtros] No se pudo listar la carpeta:',
            error
          );
        }
      }


      return Array
        .from(found)
        .map(
          (filename, index) => ({
            id: `vid_${index}`,
            title:
              this.filenameToTitle(
                filename
              ),
            src:
              folder + filename
          })
        );
    },


    filenameToTitle(filename) {

      const base =
        filename.replace(
          /\.[^/.]+$/,
          ''
        );

      return (
        base
          .replace(/[_-]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim()
          .replace(
            /\b\w/g,
            char =>
              char.toUpperCase()
          ) ||
        'Video'
      );
    },


    updateNav() {

      const total =
        this.videos.length;

      const current =
        total
          ? this.videos[
              this.currentIndex
            ]
          : null;


      const title =
        document.getElementById(
          'video-title'
        );

      const counter =
        document.getElementById(
          'video-counter'
        );


      if (title) {

        title.textContent =
          current
            ? `🎬 ${current.title}`
            : '🎬 Sin videos';
      }


      if (counter) {

        counter.textContent =
          total
            ? `${this.currentIndex + 1} / ${total}`
            : '0 / 0';
      }


      const prev =
        document.getElementById(
          'btn-prev'
        );

      const next =
        document.getElementById(
          'btn-next'
        );


      if (prev) {

        prev.disabled =
          !total ||
          this.currentIndex === 0;
      }


      if (next) {

        next.disabled =
          !total ||
          this.currentIndex ===
            total - 1;
      }
    },


    loadVideoByIndex(index) {

      if (!this.videos.length) {
        return;
      }

      this.currentIndex =
        Math.max(
          0,
          Math.min(
            index,
            this.videos.length - 1
          )
        );

      this.loadVideo(
        this.videos[
          this.currentIndex
        ]
      );

      this.updateNav();
    },


    nextVideo() {

      this.loadVideoByIndex(
        this.currentIndex + 1
      );
    },


    prevVideo() {

      this.loadVideoByIndex(
        this.currentIndex - 1
      );
    },


    showEmptyState() {

      this.updateNav();

      const label =
        document.getElementById(
          'filter-label'
        );

      if (label) {
        label.textContent =
          'SIN VIDEOS';
      }
    },


    loadVideo(videoData) {

      if (!this.video) {
        return;
      }

      this.video.pause();

      this.video.src =
        videoData.src;

      this.video.load();

      this.video
        .play()
        .catch(
          error => {

            console.warn(
              '[filtros] El navegador no inició autoplay:',
              error
            );
          }
        );
    },


    setFilter(name) {

      const allowed =
        [
          'none',
          'blur',
          'pixel',
          'thermal',
          'saturate'
        ];

      this.currentFilter =
        allowed.includes(name)
          ? name
          : 'none';


      document
        .querySelectorAll(
          '.filter-btn'
        )
        .forEach(button => {

          button.classList.toggle(
            'active',
            button.dataset.filter ===
              this.currentFilter
          );
        });


      const original =
        document.getElementById(
          'btn-original'
        );

      if (original) {

        original.classList.toggle(
          'active',
          this.currentFilter === 'none'
        );
      }


      const labels = {
        none:
          'SIN FILTRO',

        blur:
          '🌫️ DESENFOQUE',

        pixel:
          '🟦 PIXELADO',

        thermal:
          '🌡️ CÁMARA TÉRMICA',

        saturate:
          '🎨 ALTA SATURACIÓN'
      };


      const label =
        document.getElementById(
          'filter-label'
        );

      if (label) {

        label.textContent =
          labels[
            this.currentFilter
          ];
      }
    },


    setIntensity(value) {

      const parsed =
        Number(value);

      this.intensity =
        Math.max(
          1,
          Math.min(
            100,
            Number.isFinite(parsed)
              ? parsed
              : 50
          )
        );


      const label =
        document.getElementById(
          'intensity-val'
        );

      if (label) {

        label.textContent =
          `${Math.round(
            this.intensity
          )}%`;
      }
    },


    resizeCanvas(force = false) {

      if (
        !this.video ||
        !this.canvas ||
        !this.canvas.parentElement ||
        this.video.readyState < 1
      ) {
        return;
      }


      const vw =
        this.video.videoWidth ||
        320;

      const vh =
        this.video.videoHeight ||
        240;


      const stage =
        this.canvas.parentElement;


      if (
        !stage.clientWidth ||
        !stage.clientHeight
      ) {
        return;
      }


      const ratio =
        Math.min(
          stage.clientWidth / vw,
          stage.clientHeight / vh
        );


      const width =
        Math.max(
          1,
          Math.floor(
            vw * ratio
          )
        );

      const height =
        Math.max(
          1,
          Math.floor(
            vh * ratio
          )
        );


      if (
        force ||
        this.canvas.width !== width ||
        this.canvas.height !== height
      ) {

        this.canvas.width =
          width;

        this.canvas.height =
          height;
      }
    },


    loop() {

      const render =
        timestamp => {

          if (
            this.destroyed ||
            !this.canvas ||
            !document.body.contains(
              this.canvas
            )
          ) {

            this.destroy();

            return;
          }


          this.animFrame =
            requestAnimationFrame(
              render
            );


          if (
            timestamp -
              this.lastRenderTime <
            this.targetFrameInterval
          ) {
            return;
          }


          this.lastRenderTime =
            timestamp;


          if (
            !this.video ||
            this.video.readyState < 2
          ) {
            return;
          }


          this.resizeCanvas();


          const width =
            this.canvas.width;

          const height =
            this.canvas.height;


          if (
            width <= 0 ||
            height <= 0
          ) {
            return;
          }


          this.ctx.filter =
            'none';

          this.ctx.drawImage(
            this.video,
            0,
            0,
            width,
            height
          );


          if (
            this.currentFilter !==
            'none'
          ) {

            this.applyFilter(
              this.currentFilter
            );
          }
        };


      this.animFrame =
        requestAnimationFrame(
          render
        );
    },


    applyFilter(filter) {

      const intensity =
        this.intensity / 100;

      const width =
        this.canvas.width;

      const height =
        this.canvas.height;


      switch (filter) {

        case 'blur':

          this.filterBlur(
            intensity,
            width,
            height
          );

          break;


        case 'pixel':

          this.filterPixel(
            intensity,
            width,
            height
          );

          break;


        case 'thermal':

          this.filterThermal(
            intensity,
            width,
            height
          );

          break;


        case 'saturate':

          this.filterSaturate(
            intensity,
            width,
            height
          );

          break;
      }
    },


    // FILTRO 1: DESENFOQUE
    filterBlur(
      intensity,
      width,
      height
    ) {

      const radius =
        Math.max(
          1,
          Math.round(
            intensity * 12
          )
        );


      this.ctx.save();

      this.ctx.filter =
        `blur(${radius}px)`;


      this.ctx.drawImage(
        this.video,
        0,
        0,
        width,
        height
      );


      this.ctx.restore();
    },


    // FILTRO 2: PIXELADO
    filterPixel(
      intensity,
      width,
      height
    ) {

      const size =
        Math.max(
          2,
          Math.round(
            intensity * 30
          )
        );


      const smallWidth =
        Math.max(
          1,
          Math.floor(
            width / size
          )
        );


      const smallHeight =
        Math.max(
          1,
          Math.floor(
            height / size
          )
        );


      if (
        this.pixelCanvas.width !==
        smallWidth
      ) {

        this.pixelCanvas.width =
          smallWidth;
      }


      if (
        this.pixelCanvas.height !==
        smallHeight
      ) {

        this.pixelCanvas.height =
          smallHeight;
      }


      this.pixelCtx.clearRect(
        0,
        0,
        smallWidth,
        smallHeight
      );


      this.pixelCtx.drawImage(
        this.canvas,
        0,
        0,
        smallWidth,
        smallHeight
      );


      this.ctx.save();

      this.ctx.imageSmoothingEnabled =
        false;


      this.ctx.drawImage(
        this.pixelCanvas,
        0,
        0,
        smallWidth,
        smallHeight,
        0,
        0,
        width,
        height
      );


      this.ctx.restore();
    },


    // FILTRO 3: CÁMARA TÉRMICA
    filterThermal(
      intensity,
      width,
      height
    ) {

      const imageData =
        this.ctx.getImageData(
          0,
          0,
          width,
          height
        );


      const data =
        imageData.data;


      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const lum =
          0.299 * data[i] +
          0.587 * data[i + 1] +
          0.114 * data[i + 2];


        let red;
        let green;
        let blue;


        if (lum < 85) {

          red = 0;

          green =
            Math.round(
              lum * 3
            );

          blue =
            255 -
            Math.round(
              lum * 3
            );

        } else if (lum < 170) {

          const normalized =
            (lum - 85) / 85;

          red =
            Math.round(
              normalized * 255
            );

          green = 255;

          blue = 0;

        } else {

          const normalized =
            (lum - 170) / 85;

          red = 255;

          green =
            Math.round(
              255 -
              normalized * 255
            );

          blue = 0;
        }


        data[i] =
          Math.round(
            data[i] *
              (1 - intensity) +
            red *
              intensity
          );


        data[i + 1] =
          Math.round(
            data[i + 1] *
              (1 - intensity) +
            green *
              intensity
          );


        data[i + 2] =
          Math.round(
            data[i + 2] *
              (1 - intensity) +
            blue *
              intensity
          );
      }


      this.ctx.putImageData(
        imageData,
        0,
        0
      );
    },


    // FILTRO 4: ALTA SATURACIÓN
    filterSaturate(
      intensity,
      width,
      height
    ) {

      const imageData =
        this.ctx.getImageData(
          0,
          0,
          width,
          height
        );


      const data =
        imageData.data;


      const factor =
        1 +
        intensity * 4;


      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const red =
          data[i];

        const green =
          data[i + 1];

        const blue =
          data[i + 2];


        const lum =
          0.299 * red +
          0.587 * green +
          0.114 * blue;


        data[i] =
          Math.min(
            255,
            Math.max(
              0,
              Math.round(
                lum +
                (red - lum) *
                  factor
              )
            )
          );


        data[i + 1] =
          Math.min(
            255,
            Math.max(
              0,
              Math.round(
                lum +
                (green - lum) *
                  factor
              )
            )
          );


        data[i + 2] =
          Math.min(
            255,
            Math.max(
              0,
              Math.round(
                lum +
                (blue - lum) *
                  factor
              )
            )
          );
      }


      this.ctx.putImageData(
        imageData,
        0,
        0
      );
    }
  };


  /*
   * En vistas inyectadas dentro de la SPA,
   * DOMContentLoaded suele haber ocurrido ya.
   */
  if (
    document.readyState ===
    'loading'
  ) {

    document.addEventListener(
      'DOMContentLoaded',
      () => FV.init(),
      { once: true }
    );

  } else {

    FV.init();
  }

})();
</script>
