<div id="fav-team-banner" class="fav-team-banner hidden">
    <div class="fav-team-banner-logo">
        <img id="main-team-logo-banner" src="" alt="Logo de tu equipo favorito">
    </div>
    <div class="fav-team-banner-text">
        <span class="fav-team-banner-label">TU EQUIPO FAVORITO</span>
        <span id="main-team-name" class="fav-team-banner-name"></span>
    </div>
</div>

<div class="showcase-container">
    <div class="showcase-frame">
        <img id="main-team-logo" src="" alt="Logo del equipo favorito" style="width:140px;height:140px;object-fit:contain;">
    </div>
    <p class="showcase-title" id="showcase-team-name">Baseball Legends Museum</p>
</div>

<div class="action-buttons-row">
    <button class="btn-primary" onclick="cargarVista('filtros')">FILTROS DE VIDEO</button>
    <button class="btn-secondary" onclick="cargarVista('trivia')">TRIVIA MLB</button>
</div>

<!-- Botón de Galería y Minijuego -->
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%;">
    <button class="btn-primary" onclick="cargarVista('galeria')" style="background: linear-gradient(135deg, var(--color-primary, #1e3a8a), var(--color-secondary, #3b82f6)); width: 100%; border: 1px solid var(--color-gold, #d4af37);">
        🖼️ GALERÍA DE EQUIPOS
    </button>
    <button class="btn-primary" onclick="cargarVista('minijuego')" style="background: linear-gradient(135deg, #d4af37, #b8860b); width: 100%; border: none;">
        🎮 DERBY DE HOME RUNS
    </button>
</div>
