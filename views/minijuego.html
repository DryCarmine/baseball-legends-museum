<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #derby-root {
    background: #0a0a1a;
    color: #fff;
    font-family: 'Arial Black', sans-serif;
    height: calc(100dvh - 120px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  .hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: rgba(0,0,0,0.6);
    border-bottom: 2px solid #d4af37;
    flex-shrink: 0;
  }
  .hdr-title { font-size: 1rem; color: #d4af37; letter-spacing: 2px; }
  .hdr-stats { display: flex; gap: 18px; }
  .stat { text-align: center; }
  .stat-lbl { font-size: 0.55rem; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; }
  .stat-val { font-size: 1rem; font-weight: 900; color: #fff; }

.field {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.55) 100%),
      url('assets/images/stadium_bg.jpg') center 65% / cover no-repeat;
    background-attachment: scroll;
    -webkit-background-size: cover;
    background-size: cover;
  }

  @media (max-width: 480px) {
    .field {
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%),
        url('assets/images/stadium_bg.jpg') center 65% / cover no-repeat;
      background-attachment: scroll;
    }
  }

  .diamond {
    position: absolute;
    bottom: 60px;
    left: 50%;
    width: 80px;
    height: 80px;
    border: 2px solid rgba(255,255,255,0.15);
    transform: translateX(-50%) rotate(45deg);
  }

  .field-line { position: absolute; bottom: 0; width: 2px; height: 45%; background: rgba(255,255,255,0.08); transform-origin: bottom center; }
  .field-line.left  { left: 15%; transform: rotate(30deg); }
  .field-line.right { right: 15%; transform: rotate(-30deg); }

  .bat-zone {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .track {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    position: relative;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .zone-perfect {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 100%;
    background: rgba(0,255,80,0.35);
    border-radius: 4px;
    border: 1px solid rgba(0,255,80,0.7);
    box-shadow: 0 0 8px rgba(0,255,80,0.4);
  }

  .zone-good {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 100%;
    background: rgba(255,200,0,0.15);
    border-radius: 4px;
    border: 1px solid rgba(255,200,0,0.4);
  }

  #derby-ball {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #e8e8e8 50%, #ccc 100%);
    box-shadow: 0 0 8px rgba(255,255,255,0.5), inset 0 1px 2px rgba(255,255,255,0.8);
    z-index: 10;
  }
  #derby-ball::before, #derby-ball::after {
    content: '';
    position: absolute;
    border: 1.5px solid rgba(200,50,50,0.7);
    border-radius: 50%;
  }
  #derby-ball::before { width: 8px; height: 14px; top: 3px; left: 3px; border-right-color: transparent; border-bottom-color: transparent; }
  #derby-ball::after  { width: 8px; height: 14px; bottom: 3px; right: 3px; border-left-color: transparent; border-top-color: transparent; }

  .batter-svg {
    position: absolute;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px; height: 80px;
    z-index: 5;
  }

  .zone-labels {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    font-size: 0.55rem;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }
  .lbl-perfect { color: #0f0; font-weight: bold; }
  .lbl-good    { color: #ffd700; }

  .speed-bar {
    position: absolute;
    top: 12px; right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .speed-lbl { font-size: 0.55rem; color: #888; text-transform: uppercase; }
  .speed-track { width: 60px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .speed-fill  { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0f0, #ffd700, #f00); transition: width 0.3s; }

  #derby-result-flash {
    position: absolute;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 2rem; font-weight: 900;
    text-shadow: 0 0 20px currentColor;
    z-index: 100;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    white-space: nowrap;
  }
  #derby-result-flash.show { transform: translate(-50%, -50%) scale(1); }

  #derby-fly-ball {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #ccc);
    box-shadow: 0 0 12px rgba(255,255,255,0.8);
    z-index: 50;
    pointer-events: none;
    display: none;
  }

  .confetti-piece {
    position: absolute;
    width: 7px; height: 7px;
    border-radius: 2px;
    z-index: 90;
    pointer-events: none;
  }

  .swing-wrap {
    flex-shrink: 0;
    padding: 10px 16px 14px;
    background: rgba(0,0,0,0.5);
    border-top: 1px solid rgba(212,175,55,0.3);
  }
  #derby-btn-swing {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #8b0000, #c0392b);
    border: 2px solid #d4af37;
    border-radius: 14px;
    color: #fff;
    font-size: 1.3rem; font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform 0.1s, filter 0.1s;
  }
  #derby-btn-swing:active { transform: scale(0.96); filter: brightness(0.85); }
  #derby-btn-swing:disabled { opacity: 0.4; cursor: not-allowed; }

  .trophy-bar {
    flex-shrink: 0;
    padding: 8px 12px;
    background: rgba(0,0,0,0.4);
    border-top: 1px solid rgba(212,175,55,0.15);
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .trophy-bar::-webkit-scrollbar { display: none; }
  .trophy-chip {
    display: flex; flex-direction: column; align-items: center;
    min-width: 52px; padding: 5px 6px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    font-size: 0.55rem; color: #666;
    text-align: center;
    transition: all 0.4s;
    flex-shrink: 0;
  }
  .trophy-chip.unlocked {
    border-color: #d4af37; color: #fff;
    background: rgba(212,175,55,0.12);
    box-shadow: 0 0 8px rgba(212,175,55,0.2);
  }
  .trophy-chip .t-icon { font-size: 1.3rem; margin-bottom: 2px; }

  #derby-game-over {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 300;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
  }
  #derby-game-over.show { opacity: 1; pointer-events: auto; }
  .go-title { font-size: 2.2rem; color: #d4af37; text-shadow: 0 0 20px #d4af37; }
  .go-stats { display: flex; gap: 24px; font-size: 1rem; }
  .go-stat { text-align: center; }
  .go-stat span { display: block; font-size: 1.6rem; font-weight: 900; color: #d4af37; }
  .go-stat small { font-size: 0.65rem; color: #888; text-transform: uppercase; }
  .btn-restart {
    padding: 12px 32px;
    background: #8b0000;
    border: 2px solid #d4af37;
    border-radius: 10px;
    color: #fff; font-size: 1rem; font-weight: bold;
    cursor: pointer; letter-spacing: 1px;
  }

  .pitch-indicator { position: absolute; top: 12px; left: 12px; font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .pitch-dots { display: flex; gap: 4px; margin-top: 4px; }
  .pitch-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
  .pitch-dot.strike { background: #f44; border-color: #f44; }
  .pitch-dot.hit    { background: #0f0; border-color: #0f0; }

  .derby-trail {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    pointer-events: none; z-index: 9;
  }

  .museum-wallet {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 32px;
    padding: 6px 12px;
    background: rgba(212,175,55,0.08);
    border-bottom: 1px solid rgba(212,175,55,0.22);
    color: #d4af37;
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.4px;
  }

  .museum-wallet strong {
    color: #fff;
    font-size: 0.78rem;
  }

  .go-reward {
    min-width: 250px;
    padding: 10px 14px;
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 10px;
    background: rgba(212,175,55,0.10);
    color: #fff;
    text-align: center;
    font-size: 0.76rem;
    line-height: 1.4;
  }

  .go-reward strong {
    color: #d4af37;
    font-size: 1rem;
  }

  @media (max-width: 420px) {
    .hdr {
      padding-left: 10px;
      padding-right: 10px;
    }

    .hdr-title {
      font-size: 0.82rem;
      letter-spacing: 1px;
    }

    .hdr-stats {
      gap: 10px;
    }
  }

</style>

<div id="derby-root">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-title">⚾ HOME RUN DERBY</div>
    <div class="hdr-stats">
      <div class="stat"><span class="stat-lbl">Score</span><span class="stat-val" id="derby-score">0</span></div>
      <div class="stat"><span class="stat-lbl">HRs</span><span class="stat-val" id="derby-hrs">0</span></div>
      <div class="stat"><span class="stat-lbl">Mejor</span><span class="stat-val" id="derby-best">0</span></div>
    </div>
  </div>

  <div class="museum-wallet">
    🏛️ Puntos del museo:
    <strong id="derby-museum-points">0</strong>
  </div>

  <!-- CAMPO -->
  <div class="field" id="derby-field">
    <div class="field-line left"></div>
    <div class="field-line right"></div>
    <div class="diamond"></div>

    <div class="pitch-indicator">
      Pitches
      <div class="pitch-dots" id="derby-pitch-dots"></div>
    </div>

    <div class="speed-bar">
      <div class="speed-lbl">Velocidad</div>
      <div class="speed-track"><div class="speed-fill" id="derby-speed-fill" style="width:30%"></div></div>
    </div>

    <div class="bat-zone">
      <div class="track" id="derby-track">
        <div class="zone-good"></div>
        <div class="zone-perfect"></div>
        <div class="derby-trail" id="derby-trail"></div>
        <div id="derby-ball"></div>
      </div>
    </div>

    <div class="zone-labels">
      <span class="lbl-good">Buena ←</span>
      <span class="lbl-perfect">⚡PERFECTO⚡</span>
      <span class="lbl-good">→ Buena</span>
    </div>

    <svg class="batter-svg" id="derby-batter-svg" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="65" rx="12" ry="14" fill="#1a3a6b"/>
      <circle cx="30" cy="28" r="12" fill="#f5c5a3"/>
      <path d="M18 26 Q18 14 30 14 Q42 14 42 26 Z" fill="#1a3a6b"/>
      <ellipse cx="20" cy="26" rx="4" ry="3" fill="#1a3a6b"/>
      <line x1="30" y1="42" x2="10" y2="38" stroke="#f5c5a3" stroke-width="4" stroke-linecap="round" id="derby-arm"/>
      <line x1="10" y1="38" x2="-2" y2="30" stroke="#8B4513" stroke-width="5" stroke-linecap="round" id="derby-bat-line"/>
      <line x1="24" y1="76" x2="20" y2="80" stroke="#1a3a6b" stroke-width="5" stroke-linecap="round"/>
      <line x1="36" y1="76" x2="40" y2="80" stroke="#1a3a6b" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="68" text-anchor="middle" fill="white" font-size="8" font-weight="bold">42</text>
    </svg>

    <div id="derby-fly-ball"></div>
    <div id="derby-result-flash"></div>
    <div id="derby-game-over">
      <div class="go-title">⚾ FIN DEL JUEGO</div>
      <div class="go-stats">
        <div class="go-stat"><span id="derby-go-score">0</span><small>Score</small></div>
        <div class="go-stat"><span id="derby-go-hrs">0</span><small>Home Runs</small></div>
        <div class="go-stat"><span id="derby-go-hits">0</span><small>Hits</small></div>
      </div>

      <div class="go-reward">
        Ganaste <strong id="derby-go-museum-earned">0</strong>
        puntos del museo.<br>
        Saldo total:
        <strong id="derby-go-museum-total">0</strong>
      </div>

      <button class="btn-restart" id="derby-btn-restart">🔄 JUGAR DE NUEVO</button>
    </div>
  </div>

  <!-- BOTÓN -->
  <div class="swing-wrap">
    <button id="derby-btn-swing">🏏 BATEAR</button>
  </div>

  <!-- TROFEOS -->
  <div class="trophy-bar" id="derby-trophy-bar"></div>

</div>

<script src="js/minijuego.js?v=3"></script>
