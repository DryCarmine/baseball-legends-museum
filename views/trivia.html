<div style="padding: 20px; color: #fff; text-align: center; max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 10px; color: #ffcc00;">TRIVIA MLB</h2>
    <p id="trivia-instruccion" style="margin-bottom: 20px; opacity: 0.8; font-size: 14px;">Pon a prueba tus conocimientos sobre el béisbol.</p>
    
    <div id="trivia-card" style="background: rgba(20, 20, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <h3 id="pregunta-texto" style="font-size: 16px; margin-bottom: 20px; color: #fff;">Cargando pregunta...</h3>
        <div id="opciones-container" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Opciones dinámicas -->
        </div>
    </div>

    <div id="trivia-resultado" style="font-size: 16px; font-weight: bold; margin: 15px 0; min-height: 24px;"></div>
    
    <button id="btn-siguiente" style="display: none; margin: 10px auto 0; padding: 10px 20px; background: #e63946; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">Siguiente Pregunta</button>
</div>
